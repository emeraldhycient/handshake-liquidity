<!-- hero  -->
<section class="lp:pb-44! pt-28 pb-20 md:pt-39 md:pb-25 lg:pb-30">
  <div class="main-container">
    <div class="space-y-[72px]">
      <div class="space-y-3 text-center">
        <h2
          data-text-reveal
          class="font-sora text-sora-heading-4 md:text-sora-heading-3 lg:text-sora-heading-2 text-background-13/90 font-normal"
        >
          How Handshake Liquidity began
        </h2>
        <p
          data-text-reveal
          data-delay="0.2"
          class="font-inter-tight text-tagline-2 text-background-13/60 mx-auto max-w-[490px] font-normal"
        >
          Handshake was founded to give global platforms one settlement and ad-automation
          layer, so they can pay anyone, anywhere, at scale.
        </p>
      </div>

      <div
        class="lp:gap-x-22.5! flex flex-col justify-center gap-x-8 gap-y-8 lg:flex-row lg:gap-y-0 xl:gap-x-14"
      >
        <!-- img  -->
        <figure
          data-opai-animate
          data-delay="0.3"
          data-instant
          class="relative mx-auto h-[500px] overflow-hidden rounded-lg lg:mx-0 lg:h-[564px] lg:w-full lg:max-w-[380px] xl:h-[500px]"
        >
          <!-- left gradient  -->
          <figure
            data-opai-animate
            data-delay="0.4"
            data-instant
            data-direction="left"
            data-offset="100"
            class="pointer-events-none absolute top-[-292px] left-[-162px] size-[468px] rotate-353 select-none"
          >
            <img src="./images/opai-6.png" alt="about-hero-img" class="size-full object-cover" />
          </figure>

          <img src="./images/opai-img-25.png" alt="about-hero-img" class="size-full object-cover" />

          <!-- bottom blur  -->
          <div
            data-progressive-blur-effect
            data-intensity="250"
            data-position="bottom"
            class="h-[150px] rounded-b-lg bg-[linear-gradient(180deg,rgba(17,20,29,0.04)_0%,rgba(17,20,29,0.04)_100%)]"
          ></div>
        </figure>

        <div
          class="flex w-full items-center justify-center lg:w-auto"
        >
          <!-- success card  -->
          <div
            data-opai-animate
            data-delay="0.5"
            class="bg-background-5 relative w-full space-y-13 overflow-hidden rounded-lg p-5 md:max-w-[300px] md:p-12 lg:max-w-[367px]"
          >
            <!-- right gradient   -->
            <figure
              data-opai-animate
              data-delay="0.6"
              data-direction="right"
              data-offset="100"
              class="pointer-events-none absolute top-[-99%] right-[-48%] h-[300px] w-[330px] select-none md:top-[-70%] lg:top-[-64%] lg:right-[-31%]"
            >
              <img src="./images/opai-1.png" alt="about-hero-img" />
            </figure>
            <span class="ns-shape-23 inline-block text-[56px] text-white/90"> </span>
            <div class="relative z-10 space-y-3">
              <p class="font-inter-tight text-tagline-1 font-normal text-white/90">
                Customer satisfaction rate
              </p>
              <h3
                class="font-sora text-sora-heading-4 md:text-sora-heading-3 lg:text-sora-heading-2 flex items-center text-white/90"
              >
                <span
                  data-counter
                  data-number="95"
                  data-speed="1400"
                  data-interval="200"
                  data-rooms="2"
                  data-height-space="1.9"
                  >95</span
                >%
              </h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
