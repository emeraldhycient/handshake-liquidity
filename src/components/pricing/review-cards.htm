<!-- pricing review cards -->
<section class="lp:py-39! py-20 md:py-28">
  <div class="main-container">
    <div class="space-y-19">
      <h2
        data-text-reveal
        id="testimonials-heading"
        class="text-sora-heading-3 lg:text-sora-heading-2 text-background-13/90 font-sora text-center font-normal"
      >
        What our clients say
      </h2>

      <!-- testimonial cards  -->

      <div class="grid grid-cols-12 items-center justify-center gap-4 xl:gap-2">
        <!-- card one  -->
        <div
          data-opai-animate
          data-delay="0.1"
          class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3"
        >
          <Component
            src="src/components/shared/card/testimonial-card.htm"
            content="Handshake’s reconciliation and reporting cut our month-end close from days to minutes across every payout corridor."
            image="./images/opai-avatar-img-275.png"
            alt="Jordan Smith, VP Finance Operations at a global marketplace"
            name="Jordan Smith"
            position="VP Finance Operations, a global marketplace"
            class="bg-white"
            quoteClass="text-background-13/90"
            nameClass="text-black"
            positionClass="text-background-13/60"
          />
        </div>

        <!-- card two  -->
        <div
          data-opai-animate
          data-delay="0.2"
          class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3"
        >
          <Component
            src="src/components/shared/card/testimonial-card.htm"
            content="We now route bulk disbursements to local banks and mobile-money wallets in under 2 seconds. Payout failures are a non-issue."
            image="./images/opai-avatar-img-276.png"
            alt="Mia Thompson, Head of Payments at a ride-hailing platform"
            name="Mia Thompson"
            position="Head of Payments, a ride-hailing platform"
            class="bg-white"
            quoteClass="text-background-13/90"
            nameClass="text-black"
            positionClass="text-background-13/60"
          />
        </div>

        <!-- card three  -->
        <div
          data-opai-animate
          data-delay="0.3"
          class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3"
        >
          <Component
            src="src/components/shared/card/testimonial-card.htm"
            content="Expanding into new markets used to take months. With their local rails and automatic FX, we launched new corridors in weeks."
            image="./images/opai-avatar-img-03.png"
            alt="Alex Johnson, Treasury Lead at a remittance app"
            name="Alex Johnson"
            position="Treasury Lead, a remittance app"
            class="bg-white"
            quoteClass="text-background-13/90"
            nameClass="text-black"
            positionClass="text-background-13/60"
          />
        </div>

        <!-- card four  -->
        <div
          data-opai-animate
          data-delay="0.4"
          class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3"
        >
          <Component
            src="src/components/shared/card/testimonial-card.htm"
            content="Their ad spend automation tunes our bids and budgets across every network. We saw ROI within 3 months."
            image="./images/opai-avatar-img-274.png"
            alt="Sarah Chen, Director of Growth at an affiliate network"
            name="Sarah Chen"
            position="Director of Growth, an affiliate network"
            class="bg-background-1"
            quoteClass="text-white/90"
            nameClass="text-white"
            positionClass="text-white/60"
          />
        </div>
      </div>
    </div>
  </div>
</section>
